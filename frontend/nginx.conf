# ── Backend addressing ────────────────────────────────────────────────────────
# nginx resolves a literal `proxy_pass http://backend:9000` ONCE, when the
# config loads, and then caches that container IP forever. Recreate the backend
# container and it gets a new IP, so every /api/* call returns 502 until the
# frontend container is restarted. That was the "trade backend returned 502" bug.
#
# The fix is the variable form: with a variable in proxy_pass nginx is forced to
# resolve the name at request time through Docker's embedded DNS (127.0.0.11),
# so it always dials the backend's current address. `valid=5s` bounds the cache.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    # Trader video uploads (verification clips, promo renders) — nginx defaults
    # to 1 MB and answers 413 before the backend ever sees the body.
    client_max_body_size 120m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend container
    location ^~ /api/ {
        set $backend_upstream "http://backend:9000";
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Dataset photos are served by the backend (product images + fingerprints)
    location ^~ /dataset/ {
        set $backend_upstream "http://backend:9000";
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Trader-uploaded verification photos live on the backend
    location ^~ /uploads/ {
        set $backend_upstream "http://backend:9000";
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA fallback — serve index.html for any unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
